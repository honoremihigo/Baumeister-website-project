<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./dist/output.css" />
    <title>Website project template</title>
  </head>
  <script>
    const loadComponents = (id, url, callback) => {
      fetch(url)
        .then((response) => response.text())
        .then((html) => {
          document.getElementById(id).innerHTML = html;
          if (callback) callback();
        });
    };

    window.onload = () => {
      loadComponents("header", "src/sections/header.html", navFunction);
      loadComponents("hero", "src/sections/hero.html");
      loadComponents("about", "src/sections/about.html");
      loadComponents("yellow", "src/sections/yellow.html");
      loadComponents("strategy", "src/sections/strategy.html");
      loadComponents("collaborators", "src/sections/collaborators.html");
      loadComponents("footer", "src/sections/footer.html");
    };
  </script>
  <body>
    <div id="header" class="sticky top-0 z-50"></div>
    <div id="hero"></div>
    <div id="about"></div>
    <div id="yellow" class="sticky -top-[5rem] z-40"></div>
    <div id="strategy"></div>
    <div id="collaborators"></div>
    <div id="footer"></div>
    <script src="./script.js"></script>
  </body>
</html>
